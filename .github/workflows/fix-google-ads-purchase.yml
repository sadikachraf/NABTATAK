name: Fix Google Ads Purchase Tracking

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Google Ads purchase conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "gtag('event','conversion',{send_to:'AW-17684707346',value:p.price,currency:'QAR'});"
          new = "gtag('event','conversion',{send_to:'AW-17684707346/xpSlCL3Vq7kcEJLw3PBB',value:p.price,currency:'QAR',transaction_id:payload.order_id});"
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print('Patched Google Ads purchase conversion send_to and transaction_id.')
          elif new in text:
              print('Google Ads purchase conversion is already patched.')
          else:
              raise SystemExit('Target Google Ads conversion snippet was not found.')
          PY
          rm -f .github/workflows/fix-google-ads-purchase.yml

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add index.html .github/workflows/fix-google-ads-purchase.yml
          git commit -m "Fix Google Ads purchase conversion tracking"
          git push
